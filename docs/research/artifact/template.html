<style>
/* Layout: single reading column (max 980px) of numbered evidence sections; charts sit full-column, notes in a muted aside row. */
:root{
  --bg:#f4f6f8; --surface:#fcfcfb; --ink:#12171e; --ink-2:#4a525d; --muted:#7c838c;

  --en:#2a78d6; --pl:#eb6834; --other:#9aa3ad;

  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#171b21; --ink:#eef1f4; --ink-2:#b9c0c8; --muted:#8a929b;
  --rule:#2a3038; --grid:#262c33; --accent:#8db4ff; --accent-soft:#1c2a42;
  --en:#3987e5; --pl:#d95926; --other:#6b737c;
  --good:#4cc27a; --good-bg:#16301f; --warn:#e7a84a; --warn-bg:#33270f; --bad:#ef7b7b; --bad-bg:#3a1b1b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171b21; --ink:#eef1f4; --ink-2:#b9c0c8; --muted:#8a929b;
  --rule:#2a3038; --grid:#262c33; --accent:#8db4ff; --accent-soft:#1c2a42;
  --en:#3987e5; --pl:#d95926; --other:#6b737c;
  --good:#4cc27a; --good-bg:#16301f; --warn:#e7a84a; --warn-bg:#33270f; --bad:#ef7b7b; --bad-bg:#3a1b1b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:980px;margin:0 auto}
header.top{padding-block:40px 24px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,46px);line-height:1.12;margin:10px 0 14px;text-wrap:balance;max-width:22ch}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0;max-width:68ch}
.lede{font-size:18px;color:var(--ink-2);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
a{color:var(--accent)}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:28px}
.vcard{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.vnum{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1.1}
.vnum small{font-size:14px;color:var(--muted)}
.vlab{font-size:13.5px;color:var(--ink-2)}
nav.toc{display:flex;flex-wrap:wrap;gap:6px;margin-block:22px 0}
nav.toc a{font-size:13px;text-decoration:none;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;background:var(--surface)}
nav.toc a:hover,nav.toc a:focus-visible{border-color:var(--accent);color:var(--accent)}
section{padding-block:44px 8px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:12px}
.sh{display:flex;gap:14px;align-items:baseline}
.sn{font-family:var(--mono);font-size:13px;color:var(--accent);flex:none}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 12px;background:transparent;color:var(--ink-2);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:420px}
.chart text{font-family:var(--sans);fill:var(--ink-2);font-size:12px}
.chart .num{font-family:var(--mono);font-size:11.5px;fill:var(--ink)}
.chart .ax{stroke:var(--rule)} .chart .gl{stroke:var(--grid)}
.mark{cursor:default}
.mark:hover,.mark:focus{opacity:.82}
.note{font-size:13.5px;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:12px}
.note b{color:var(--ink)}
.conf{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
.c-hi{background:var(--good-bg);color:var(--good)} .c-mid{background:var(--warn-bg);color:var(--warn)} .c-lo{background:var(--bad-bg);color:var(--bad)}
details{font-size:13px}
details summary{cursor:pointer;color:var(--accent);width:max-content}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--ink-2)}
.claims{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.claim{background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.claim button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;padding:14px 16px;cursor:pointer}
.claim q{flex:1 1 220px;min-width:0}
.claim button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.claim q{font-family:var(--serif);font-style:italic;font-size:16.5px}
.claim .ans{padding:0 16px 14px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.chev{font-family:var(--mono);color:var(--muted);flex:none}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start}
.calc label{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
select,input[type=range],textarea{font:inherit;width:100%}
select{padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea{min-height:92px;padding:8px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px;resize:vertical}
input[type=range]{accent-color:var(--accent)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.out div{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.out b{font-family:var(--mono);font-size:22px;font-weight:500}
.out span{font-size:12.5px;color:var(--muted)}
.matrix td{white-space:normal;vertical-align:top}
.matrix td:first-child{font-weight:600;white-space:nowrap}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rec{border-top:2px solid var(--accent);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rec h3{font-family:var(--serif);font-size:17px}
.rec p{font-size:14.5px;color:var(--ink-2)}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.pipe span.box{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:6px 10px}
.pipe span.arr{color:var(--muted);font-family:var(--mono)}
.src{columns:2 280px;column-gap:28px;font-size:13px;color:var(--ink-2)}
.src li{break-inside:avoid;margin-bottom:5px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 20px}
#tip{position:fixed;pointer-events:none;z-index:10;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:6px;max-width:260px;line-height:1.4}
#tip b{font-family:var(--mono);font-weight:500}
@media (prefers-reduced-motion:no-preference){.bar{transition:width .35s ease,x .35s ease}}

function showTip(e,html){tip.innerHTML=html;tip.hidden=false;const r=e.target.getBoundingClientRect?e.target.getBoundingClientRect():{left:0,top:0};const x=e.clientX??(r.left+r.width/2),y=e.clientY??r.top;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(window.innerWidth-w-8,Math.max(8,x+12))+"px";tip.style.top=Math.max(8,y-h-10)+"px"}
function hideTip(){tip.hidden=true}
function bindTips(root){root.querySelectorAll("[data-tip]").forEach(el=>{el.addEventListener("mousemove",e=>showTip(e,el.dataset.tip));el.addEventListener("mouseleave",hideTip);el.addEventListener("focus",e=>{const r=el.getBoundingClientRect();showTip({clientX:r.left+r.width/2,clientY:r.top,target:el},el.dataset.tip)});el.addEventListener("blur",hideTip)})}

/* horizontal bar chart: rows [{label,value,color,tip}] */
function hbar(rows,{max,unit="",dec=1,w=640,labelW=150,rowH=30,ticks=5}={}){
 const h=rows.length*rowH+30, x0=labelW, x1=w-56; const sx=v=>x0+(v/max)*(x1-x0);
 let g="";for(let i=0;i<=ticks;i++){const v=max*i/ticks,x=sx(v);g+=`<line class="gl" x1="${x}" x2="${x}" y1="4" y2="${h-24}"/><text x="${x}" y="${h-8}" text-anchor="middle">${fmt(v,v%1?1:0)}</text>`}
 const b=rows.map((r,i)=>{const y=8+i*rowH,bw=Math.max(2,sx(r.value)-x0);return `<text x="${x0-10}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle">${esc(r.label)}</text><rect class="mark bar" tabindex="0" data-tip="${esc(r.tip)}" x="${x0}" y="${y+5}" width="${bw}" height="${rowH-12}" rx="4" fill="${r.color}"/><text class="num" x="${x0+bw+6}" y="${y+rowH/2}" dominant-baseline="middle">${fmt(r.value,dec)}${unit}</text>`}).join("");
 return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}<line class="ax" x1="${x0}" x2="${x0}" y1="4" y2="${h-24}"/>${b}</svg>`}

/* dumbbell: rows [{label,a(en),b(pl),tip}] */
function dumbbell(rows,{min,max,w=640,labelW=170,rowH=28,ticks=5}={}){
 const h=rows.length*rowH+30,x0=labelW,x1=w-20,sx=v=>x0+(v-min)/(max-min)*(x1-x0);
 let g="";for(let i=0;i<=ticks;i++){const v=min+(max-min)*i/ticks,x=sx(v);g+=`<line class="gl" x1="${x}" x2="${x}" y1="4" y2="${h-24}"/><text x="${x}" y="${h-8}" text-anchor="middle">${fmt(v,0)}</text>`}
 const b=rows.map((r,i)=>{const y=8+i*rowH+rowH/2;return `<text x="${x0-10}" y="${y}" text-anchor="end" dominant-baseline="middle">${esc(r.label)}</text><line x1="${sx(r.a)}" x2="${sx(r.b)}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-width="2"/><g class="mark" tabindex="0" data-tip="${esc(r.tip)}"><rect x="${Math.min(sx(r.a),sx(r.b))-8}" y="${y-10}" width="${Math.abs(sx(r.a)-sx(r.b))+16}" height="20" fill="transparent"/><circle cx="${sx(r.a)}" cy="${y}" r="6" fill="var(--en)" stroke="var(--surface)" stroke-width="2"/><circle cx="${sx(r.b)}" cy="${y}" r="6" fill="var(--pl)" stroke="var(--surface)" stroke-width="2"/></g>`}).join("");
 return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}${b}</svg>`}

/* diverging bars around 0 */
function diverge(groups,{min=-10,max=10,w=640,labelW=120,rowH=26}={}){
 const rows=[];groups.forEach(g=>g.items.forEach((it,j)=>rows.push({...it,label:j?"":g.label})));
 const h=rows.length*rowH+30+ (groups.length-1)*8,x0=labelW,x1=w-40,sx=v=>x0+(v-min)/(max-min)*(x1-x0);
 let g="";for(let v=min;v<=max;v+=5){const x=sx(v);g+=`<line class="${v===0?"ax":"gl"}" x1="${x}" x2="${x}" y1="4" y2="${h-24}"/><text x="${x}" y="${h-8}" text-anchor="middle">${v>0?"+":""}${v}</text>`}
 let y=8,out="",gi=-1;rows.forEach(r=>{if(r.label){gi++;if(gi>0)y+=8;out+=`<text x="${x0-10}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle">${esc(r.label)}</text>`}
  const a=sx(Math.min(0,r.v)),bw=Math.abs(sx(r.v)-sx(0));out+=`<rect class="mark" tabindex="0" data-tip="${esc(r.tip)}" x="${a}" y="${y+4}" width="${Math.max(bw,2)}" height="${rowH-10}" rx="3" fill="${r.color}"/><text class="num" x="${r.v>=0?sx(r.v)+5:sx(r.v)-5}" y="${y+rowH/2}" text-anchor="${r.v>=0?"start":"end"}" dominant-baseline="middle">${r.v>0?"+":""}${fmt(r.v,1)}</text>`;y+=rowH});
 return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}${out}</svg>`}

${sec(5,S.s6,S.s6p,`<div class="panel">${legend([["var(--en)",S.thinkEn],["var(--other)",S.thinkNat]])}<div class="chart" id="mathC"></div></div><div class="panel"><h3>${S.polyT}</h3><div class="chart" id="polyC"></div></div><p class="note">${S.s6n}</p>`)}
${sec(6,S.s7,S.s7p,`<div class="panel"><h3>${S.massT}</h3>${legend([["var(--en)",L("en")],["var(--pl)",L("pl")]])}<div class="chart" id="massC"></div>${table(["Model","EN","PL",S.gap],D.mass.map(r=>[r[0],fmt(r[1],2),fmt(r[2],2),fmt(r[2]-r[1],2)]))}</div><div class="panel"><h3>${S.gaiaT}</h3><div class="chart" id="gaiaC"></div></div><p class="note">${S.s7n}</p>`)}
${sec(7,S.s8,"",`<div class="panel"><div class="tbl"><table class="matrix"><thead><tr>${S.mh.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${S.matrix.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="conf c-${r[2]}">${S.cf[r[2]]}</span></td></tr>`).join("")}</tbody></table></div></div>`)}
${sec(8,S.s9,"",`<div class="recs">${S.recs.map(r=>`<div class="rec"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("")}</div>`)}
${sec(9,S.s10,"",`<div class="pipe">${S.pipe.map((p,i)=>`${i?'<span class="arr">→</span>':""}<span class="box">${p}</span>`).join("")}</div><p class="note">${S.lim}</p><h3>${S.srcH}</h3><ul class="src">${SRC.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ul>`)}
<footer>${S.foot.map(f=>`<span>${f}</span>`).join("")}</footer>`;

/* claims */
document.querySelectorAll(".claim button").forEach(b=>b.addEventListener("click",()=>{const o=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",!o);$("#"+b.getAttribute("aria-controls")).hidden=o;b.querySelector(".chev").textContent=o?"+":"−"}));

/* OneRuler */
function seg(a,b,on){a.setAttribute("aria-pressed",on);b.setAttribute("aria-pressed",!on)}
function drawOne(useAvg){const d=useAvg?D.oneAvg:D.oneO3;$("#oneC").innerHTML=hbar(d.map(([k,v])=>({label:L(k),value:v,color:col(k),tip:`<b>${fmt(v,1)}%</b> · ${esc(L(k))}`})),{max:100,unit:"%",labelW:110});$("#oneT").innerHTML=table([S.calcLang,"%"],d.map(([k,v])=>[L(k),fmt(v,1)]));bindTips($("#oneC"))}
$("#oA").onclick=()=>{seg($("#oA"),$("#oB"),true);drawOne(true)};$("#oB").onclick=()=>{seg($("#oB"),$("#oA"),true);drawOne(false)};drawOne(true);
$("#gapC").innerHTML=hbar(D.oneGap.map(([k,v])=>({label:k,value:v,color:"var(--accent)",tip:`<b>${v} pp</b> · ${k}`})),{max:40,unit:" pp",labelW:70,dec:0});bindTips($("#gapC"));

/* tokens */
$("#tokC").innerHTML=hbar(D.tok.map(t=>({label:L(t[0]),value:t[1],color:col(t[0]),tip:`<b>${fmt(t[1],2)}</b> ${S.tpw} · ${fmt(t[1]/1.23,2)}× EN<br>min ${fmt(t[2],2)} – max ${fmt(t[3],2)}`})),{max:3,dec:2,labelW:110,rowH:26,ticks:6});bindTips($("#tokC"));
const CTX=[8000,32000,128000,200000,400000,1000000],CTXL=["8K","32K","128K","200K","400K","1M"];
const nf=n=>Math.round(n).toLocaleString(LANG==="pl"?"pl-PL":"en-US");
function calc(){const c=CTX[$("#ctx").value],t=D.tok.find(x=>x[0]===$("#lg").value);$("#ctxV").textContent=CTXL[$("#ctx").value];$("#oW").textContent=nf(c/t[1]);$("#oP").textContent=nf(c/t[1]/300);$("#oC").textContent=fmt(t[1]/1.23,2)+"×";
 const words=($("#txt").value.trim().match(/\S+/g)||[]).length;$("#tT").textContent=nf(words*t[1]);$("#tE").textContent=nf(words*1.23)}
["ctx","lg","txt"].forEach(i=>$("#"+i).addEventListener("input",calc));calc();

/* same questions */
let medLek=true,medSortGap=true;
function drawMed(){const i=medLek?1:3;let r=D.med.map(m=>({label:m[0],en:m[i+1],pl:m[i]}));r.sort(medSortGap?(a,b)=>(b.en-b.pl)-(a.en-a.pl):(a,b)=>b.pl-a.pl);
 $("#medC").innerHTML=dumbbell(r.map(x=>({label:x.label,a:x.en,b:x.pl,tip:`<b>${esc(x.label)}</b><br>EN ${fmt(x.en,2)} · PL ${fmt(x.pl,2)}<br>EN−PL: <b>${x.en-x.pl>0?"+":""}${fmt(x.en-x.pl,2)} pp</b>`})),{min:20,max:95,labelW:150});
 $("#medT").innerHTML=table(["Model","PL","EN","EN−PL"],r.map(x=>[x.label,fmt(x.pl,2),fmt(x.en,2),fmt(x.en-x.pl,2)]));bindTips($("#medC"))}
$("#mL").onclick=()=>{medLek=true;seg($("#mL"),$("#mD"),true);drawMed()};$("#mD").onclick=()=>{medLek=false;seg($("#mD"),$("#mL"),true);drawMed()};
$("#sG").onclick=()=>{medSortGap=true;seg($("#sG"),$("#sP"),true);drawMed()};$("#sP").onclick=()=>{medSortGap=false;seg($("#sP"),$("#sG"),true);drawMed()};drawMed();

/* retrieval */
$("#beirC").innerHTML=dumbbell(D.beir.map(b=>({label:b[0],a:b[1],b:b[2],tip:`<b>${b[0]}</b><br>EN ${fmt(b[1],1)} · PL ${fmt(b[2],2)}<br>${fmt((b[2]-b[1])/b[1]*100,1)}%`})),{min:10,max:75,labelW:120});bindTips($("#beirC"));
$("#cusC").innerHTML=diverge(D.cus.map(c=>({label:L(c[0]),items:[{v:c[1],color:"var(--other)",tip:`${esc(L(c[0]))} · ${S.noRag}: <b>${fmt(c[1],1)} pp</b>`},{v:c[2],color:"var(--accent)",tip:`${esc(L(c[0]))} · ${S.rag}: <b>+${fmt(c[2],1)} pp</b>`}]})),{min:-5,max:10});bindTips($("#cusC"));

/* reasoning */
$("#mathC").innerHTML=(function(){const rows=[];D.math.forEach(m=>{rows.push({label:L(m[0]),value:m[1],color:"var(--en)",tip:`${esc(L(m[0]))} · ${S.thinkEn}: <b>${fmt(m[1],1)}</b>`});rows.push({label:"",value:m[2],color:"var(--other)",tip:`${esc(L(m[0]))} · ${S.thinkNat}: <b>${fmt(m[2],1)}</b><br>${S.gap}: ${fmt(m[1]-m[2],1)} pp`})});return hbar(rows,{max:100,labelW:110,rowH:24})})();bindTips($("#mathC"));
$("#polyC").innerHTML=hbar(D.poly.map((v,i)=>({label:S.polyL[i],value:v,color:i===0?"var(--en)":"var(--other)",tip:`<b>${fmt(v,1)}</b> DW-ACC`})),{max:50,labelW:150});bindTips($("#polyC"));

/* agents */
$("#massC").innerHTML=dumbbell(D.mass.map(m=>({label:m[0],a:m[1],b:m[2],tip:`<b>${esc(m[0])}</b><br>EN ${fmt(m[1],2)} · PL ${fmt(m[2],2)}<br>PL−EN: <b>${fmt(m[2]-m[1],2)}</b>`})),{min:10,max:95,labelW:160});bindTips($("#massC"));
$("#gaiaC").innerHTML=hbar(D.gaia.map(([k,v])=>({label:L(k),value:v,color:col(k),tip:`<b>${fmt(v,1)}%</b> · ${esc(L(k))}`})),{max:50,unit:"%",labelW:110,rowH:24});bindTips($("#gaiaC"));
</script>
